<!doctype html>
<meta charset="utf-8">
<title>spice-lanes 見本8 ── ポップのまま、質感を16通り</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#171a21;color:#eef1f5;
     font:14px/1.6 system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
header{padding:16px 20px;border-bottom:1px solid #262b35}
h1{margin:0 0 4px;font-size:15px;letter-spacing:.04em}
header p{margin:0;font-size:12px;color:#9aa4b2}
#hero{display:block;width:100%;max-width:820px;margin:14px auto 0;border-radius:14px;
      border:1px solid #262b35;cursor:grab;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#hero:active{cursor:grabbing}
.hint{text-align:center;font-size:12px;color:#79828f;padding:9px 20px 2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:11px;padding:14px 20px 24px}
figure{margin:0;border:1px solid #262b35;border-radius:10px;overflow:hidden;background:#0f1218}
figure canvas{display:block;width:100%;height:auto;cursor:pointer}
figcaption{padding:7px 9px 9px;font-size:11.5px;border-top:1px solid #262b35}
.num{display:inline-block;min-width:1.7em;font-weight:700;color:#fff}
.how{color:#79828f;font-size:10.5px;display:block;margin-top:2px;line-height:1.5}
footer{padding:0 20px 26px;font-size:12px;color:#79828f;max-width:74ch}
b{color:#eef1f5}
</style>

<header>
  <h1>spice-lanes 見本8 ── ポップのまま、質感を16通り</h1>
  <p>形・カメラ・配色は<b>全部同じ</b>。違うのは<b>仕上げだけ</b>。<b>小さい絵をクリックすると上に大きく出る。</b></p>
</header>

<canvas id="hero"></canvas>
<p class="hint" id="heroname">1　つや消し（マット）</p>
<div class="grid" id="grid"></div>

<footer>
  16枚とも同じ幾何・同じ光。<b>変えたのは、面の塗り方と上に重ねるものだけ</b>
  （つや・粒・起毛・折り目・透け・縁の太さ・輪郭の色）。<br><br>
  番号で返して。<b>「6の質感で、縁は4くらい」</b>のような混ぜ方でもいい。
</footer>

<script>
/* ══ 3D（見本7と同じ作り） ══════════════════════════ */
const V=(x,y,z)=>({x,y,z}), MM=()=>({v:[],f:[]});
const P=(m,p)=>(m.v.push(p),m.v.length-1);
const Q=(m,a,b,c,d,col)=>m.f.push({i:[a,b,c,d],c:col});
const Tr=(m,a,b,c,col)=>m.f.push({i:[a,b,c],c:col});
function smooth(m){ const nv=m.v.map(()=>({x:0,y:0,z:0}));
  m.f.forEach(f=>{ const a=m.v[f.i[0]],b=m.v[f.i[1]],c=m.v[f.i[2]];
    const ux=b.x-a.x,uy=b.y-a.y,uz=b.z-a.z,vx=c.x-a.x,vy=c.y-a.y,vz=c.z-a.z;
    let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;
    const L=Math.hypot(nx,ny,nz)||1; f.n={x:nx/L,y:ny/L,z:nz/L};
    f.i.forEach(i=>{nv[i].x+=f.n.x;nv[i].y+=f.n.y;nv[i].z+=f.n.z;}); });
  m.n=nv.map(n=>{const L=Math.hypot(n.x,n.y,n.z)||1;return{x:n.x/L,y:n.y/L,z:n.z/L};}); return m; }
function sphere(m,cx,cy,cz,r,sx,sy,sz,col,NU=14,NV=9){ const g=[];
  for(let j=0;j<=NV;j++){ const ph=j/NV*Math.PI, row=[];
    for(let k=0;k<=NU;k++){ const th=k/NU*Math.PI*2;
      row.push(P(m,V(cx+Math.sin(ph)*Math.cos(th)*r*sx,cy-Math.cos(ph)*r*sy,cz+Math.sin(ph)*Math.sin(th)*r*sz))); }
    g.push(row); }
  for(let j=0;j<NV;j++) for(let k=0;k<NU;k++) Q(m,g[j][k],g[j][k+1],g[j+1][k+1],g[j+1][k],col); }
function cyl(m,cx,cy,cz,r0,r1,hgt,col,SEG=10){ const a=[],b=[];
  for(let k=0;k<SEG;k++){ const t=k/SEG*Math.PI*2;
    a.push(P(m,V(cx+Math.cos(t)*r0,cy,cz+Math.sin(t)*r0)));
    b.push(P(m,V(cx+Math.cos(t)*r1,cy-hgt,cz+Math.sin(t)*r1))); }
  for(let k=0;k<SEG;k++) Q(m,a[k],a[(k+1)%SEG],b[(k+1)%SEG],b[k],col);
  const c=P(m,V(cx,cy-hgt,cz)); for(let k=0;k<SEG;k++) Tr(m,b[k],b[(k+1)%SEG],c,col); }

const C={ sea:[46,190,214], sea2:[24,150,190], sand:[248,224,158], grass:[120,206,110],
  trunk:[150,104,60], leaf:[70,182,96], leaf2:[104,208,120], hull:[196,104,68], deck:[240,196,128],
  band:[250,226,150], mast:[176,120,72], sail:[255,252,244], sailB:[236,238,232], flag:[248,86,96],
  wall:[248,236,208], roof:[228,120,86] };

function ship(){ const m=MM(), N=20, LEN=48;
  const wid=z=>19*Math.pow(Math.max(0,1-Math.pow(Math.abs(z)/(LEN*1.06),2.4)),.5)+3.5;
  const dep=z=>15*Math.pow(Math.max(0,1-Math.pow(Math.abs(z)/(LEN*1.16),2.8)),.42)+2;
  const sheer=z=>-Math.pow(Math.abs(z)/LEN,2.2)*11;
  const RN=9, ring=[];
  for(let s=0;s<=N;s++){ const z=-LEN+s*(2*LEN/N),w=wid(z),h=dep(z),sh=sheer(z),r=[];
    for(let k=0;k<RN;k++){ const a=Math.PI*k/(RN-1); r.push(P(m,V(-Math.cos(a)*w,sh-Math.sin(a)*h,z))); }
    ring.push(r); }
  for(let s=0;s<N;s++){ for(let k=0;k<RN-1;k++)
      Q(m,ring[s][k],ring[s][k+1],ring[s+1][k+1],ring[s+1][k],C.hull);
    Q(m,ring[s][0],ring[s][RN-1],ring[s+1][RN-1],ring[s+1][0],C.deck); }
  [0,N].forEach((s,n)=>{ const z=-LEN+s*(2*LEN/N),r=ring[s],c=P(m,V(0,sheer(z)-2,z+(n?9:-6)));
    for(let k=0;k<RN-1;k++) n?Tr(m,r[k],r[k+1],c,C.hull):Tr(m,r[k+1],r[k],c,C.hull);
    Tr(m,r[0],r[RN-1],c,C.deck); });
  [[-20,66,22,17],[6,86,27,21],[26,58,19,15]].forEach(([mz,hgt,sw,sh])=>{
    cyl(m,0,sheer(mz)-2,mz,2.8,1.9,hgt,C.mast,10);
    const NX=12,NY=9,top=-hgt*.94,bot=-hgt*.2,g=[];
    for(let j=0;j<=NY;j++){ const row=[];
      for(let k=0;k<=NX;k++){ const tx=k/NX*2-1,ty=j/NY;
        const b=Math.cos(tx*Math.PI/2)*Math.sin((1-ty)*Math.PI*.9)*sh;
        row.push(P(m,V(tx*sw,top+(bot-top)*ty,mz-3-b))); } g.push(row); }
    for(let j=0;j<NY;j++) for(let k=0;k<NX;k++)
      Q(m,g[j][k],g[j][k+1],g[j+1][k+1],g[j+1][k], j<3?C.sailB:C.sail);
    cyl(m,0,top+1.4,mz-1,1.5,1.5,2.8,C.mast,8); });
  sphere(m,0,-92,4,5,1,1,1,C.flag,10,7);
  Tr(m,P(m,V(0,-90,2)),P(m,V(0,-80,2)),P(m,V(0,-84,-22)),C.flag);
  return smooth(m); }

function isle(cx,cz,rad,hgt,seed,props){ const m=MM(), N=26,
  R=[[1,0],[.92,.14],[.74,.36],[.5,.62],[.26,.86],[.06,1]];
  const rn=k=>.86+.18*Math.sin(k*2.3+seed)+.10*Math.sin(k*5.1+seed*2);
  const idx=R.map(([rf,hf])=>{ const row=[];
    for(let k=0;k<N;k++){ const a=k/N*Math.PI*2,j=rn(k+seed);
      row.push(P(m,V(cx+Math.cos(a)*rad*rf*j,-hgt*hf,cz+Math.sin(a)*rad*rf*j))); } return row; });
  for(let r=0;r<R.length-1;r++) for(let k=0;k<N;k++)
    Q(m,idx[r][k],idx[r][(k+1)%N],idx[r+1][(k+1)%N],idx[r+1][k], r===0?C.sand:C.grass);
  const top=P(m,V(cx,-hgt,cz)); for(let k=0;k<N;k++) Tr(m,idx[5][k],idx[5][(k+1)%N],top,C.grass);
  props.forEach(([ax,az,kind,sc=1])=>{ const x=cx+ax*rad,z=cz+az*rad,base=-hgt*.55;
    if(kind==='tree'){ cyl(m,x,base,z,2.2*sc,1.6*sc,13*sc,C.trunk,8);
      sphere(m,x,base-15*sc,z,9*sc,1,.86,1,C.leaf,12,8);
      sphere(m,x+4*sc,base-11*sc,z-3*sc,6*sc,1,.8,1,C.leaf2,10,7); }
    else { cyl(m,x,base,z,7*sc,7*sc,9*sc,C.wall,4); cyl(m,x,base-9*sc,z,10*sc,.6,9*sc,C.roof,4); } });
  return smooth(m); }

function ocean(){ const m=MM(), N=34, S=520;
  const h=(x,z)=>Math.sin(x/40)*2.2+Math.cos(z/34)*1.9+Math.sin((x+z)/58)*1.4;
  const g=[]; for(let j=0;j<=N;j++){ const row=[];
    for(let k=0;k<=N;k++){ const x=-S/2+k*S/N,z=-S/2+j*S/N; row.push(P(m,V(x,h(x,z)+8,z))); } g.push(row); }
  for(let j=0;j<N;j++) for(let k=0;k<N;k++){ const d=Math.hypot(-S/2+k*S/N,-S/2+j*S/N)/(S*.6);
    Q(m,g[j][k],g[j][k+1],g[j+1][k+1],g[j+1][k], d>.72?C.sea2:C.sea); }
  return smooth(m); }

const SCENE={ sea:ocean(), ship:ship(), isles:[
  isle(-136,-96,66,40,3,[[-.3,-.2,'tree'],[.25,.15,'tree',.85],[.05,-.5,'hut'],[.45,-.35,'tree',.7]]),
  isle(152,116,52,28,9,[[0,0,'tree',1.1],[-.4,.3,'hut',.8]]),
  isle(130,-160,36,20,17,[[0,-.1,'tree',.9]]) ] };

/* ══ 仕上げ（ここだけが違う） ══════════════════════ */
const cl=v=>v<0?0:v>255?255:v|0;
const L={x:-.42,y:-.84,z:.34}; (()=>{const n=Math.hypot(L.x,L.y,L.z);L.x/=n;L.y/=n;L.z/=n;})();
const hash=i=>((Math.sin(i*127.1)*43758.5453)%1+1)%1;

const F=[
{n:'つや消し（マット）',h:'反射なし。光の効きを弱く、影を浅く。ポップの基準',
 amb:.66,gain:.52,add:16,ol:4.5,olk:.42,sky:['#7fd8f0','#cff2fb']},
{n:'つやあり（グロス）',h:'上を向いた面に白いハイライト。プラスチックの艶',
 amb:.62,gain:.52,add:14,ol:4.5,olk:.42,spec:.9,spx:9,sky:['#7fd8f0','#cff2fb']},
{n:'粘土（クレイ）',h:'彩度を落として、影に色を残す。やわらかく重い',
 amb:.70,gain:.38,add:12,ol:3.5,olk:.5,desat:.34,sky:['#efe6d8','#d8cec0']},
{n:'プラスチック玩具',h:'艶を強く、縁を太く。色の境がはっきりする',
 amb:.60,gain:.56,add:20,ol:7,olk:.30,spec:1.3,spx:14,sky:['#8fe0f4','#dff6fd']},
{n:'木のおもちゃ',h:'面ごとに木目の色差。艶はわずか、縁は中くらい',
 amb:.66,gain:.46,add:10,ol:4,olk:.46,jit:16,warm:10,sky:['#e8ddc8','#f6efe0']},
{n:'フェルト（起毛）',h:'細かい粒を全面に散らす。光を吸って、艶がゼロ',
 amb:.70,gain:.40,add:14,ol:3,olk:.55,grain:22,sky:['#e6e2d6','#f2efe6']},
{n:'ペーパークラフト',h:'面の中で色を混ぜない（折り目が立つ）。紙の粒を薄く',
 amb:.64,gain:.50,add:18,ol:2.5,olk:.55,flat:true,grain:10,sky:['#f0ece0','#fbf8f0']},
{n:'ゼリー・グミ',h:'内側から光る。縁が明るく、光が透けたように見える',
 amb:.70,gain:.44,add:22,ol:3,olk:.35,rim:.55,spec:1.1,spx:16,sky:['#ffd9ee','#fff3dc']},
{n:'陶器（つるつる）',h:'広く弱いハイライトと、強い環境光。白が乗る',
 amb:.74,gain:.36,add:26,ol:2.5,olk:.45,spec:.7,spx:5,sky:['#e4f2f6','#fbfdfe']},
{n:'メタリック塗装',h:'鋭いハイライトと、暗い側の締まり。金属の塗り',
 amb:.44,gain:.72,add:4,ol:4,olk:.3,spec:1.8,spx:26,sky:['#b8ccd8','#e8f0f4']},
{n:'毛糸・編み',h:'粒を大きめに、方向をつけて散らす。縁は太く柔らかい',
 amb:.70,gain:.40,add:14,ol:5,olk:.5,grain:30,knit:true,sky:['#efe4d4','#f8f2e6']},
{n:'キャンディ（飴）',h:'つやを強く、縁に色を残す。彩度をさらに上げる',
 amb:.64,gain:.54,add:24,ol:4,olk:.34,spec:1.5,spx:20,sat:1.18,sky:['#ffc9e6','#fff2d8']},
{n:'マシュマロ',h:'輪郭をわずかにぼかし、影をほとんど無くす。粉っぽい白',
 amb:.80,gain:.28,add:30,ol:2,olk:.6,soft:true,sky:['#fdeff2','#fdf8f2']},
{n:'絵の具（筆致）',h:'面ごとに色を散らし、明るさを粗い段に落とす',
 amb:.62,gain:.50,add:16,ol:3,olk:.5,jit:26,band:5,grain:12,sky:['#efe6d6','#dfe6e2']},
{n:'セル（アニメ塗り）',h:'明るさを二段だけに。縁は細く濃い。塗りが平ら',
 amb:.70,gain:.44,add:14,ol:3.5,olk:.28,band:2,flat:true,sky:['#9ad8ec','#eaf6f8']},
{n:'ネオン縁（暗い海）',h:'全体を沈めて、輪郭の面だけ光らせる。泡と灯りが目立つ',
 amb:.30,gain:.34,add:2,ol:3,olk:1.6,rim:.9,neon:true,sky:['#1b2a5c','#0c1330']}
];

function render(cv,fi,o={}){
  const f=F[fi], {yaw=.6,pitch=.62,zoom=1,ui=false,ratio=.62}=o;
  const dpr=Math.min(2,devicePixelRatio||1), w=cv.clientWidth||260, h=Math.round(w*ratio);
  cv.width=w*dpr; cv.height=h*dpr;
  const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  const G=g.createLinearGradient(0,0,0,h); G.addColorStop(0,f.sky[0]); G.addColorStop(1,f.sky[1]);
  g.fillStyle=G; g.fillRect(0,0,w,h);
  const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  const sc=(w/520)*1.62*zoom;
  const proj=p=>{ const x=p.x*cy+p.z*sy, z=-p.x*sy+p.z*cy;
    return {sx:w/2+x*sc, sy:h*.62+(p.y*cp-z*sp)*sc, d:p.y*sp+z*cp}; };

  function paint(col,k,extra){ let c=[col[0],col[1],col[2]];
    if(f.desat){ const m=(c[0]+c[1]+c[2])/3; c=c.map(v=>v*(1-f.desat)+m*f.desat); }
    if(f.sat){ const m=(c[0]+c[1]+c[2])/3; c=c.map(v=>m+(v-m)*f.sat); }
    if(f.warm){ c=[c[0]+f.warm,c[1]+f.warm*.6,c[2]-f.warm*.2]; }
    return `rgb(${cl(c[0]*k+f.add+extra)},${cl(c[1]*k+f.add+extra)},${cl(c[2]*k+f.add+extra)})`; }

  function mesh(m,olcol,two){
    const pr=m.v.map(proj);
    const vi=m.n.map(n=>Math.max(0,-(n.x*L.x+n.y*L.y+n.z*L.z)));
    const list=m.f.map((F2,i)=>({F2,i,d:F2.i.reduce((s,j)=>s+pr[j].d,0)/F2.i.length})).sort((a,b)=>b.d-a.d);
    if(f.ol>0){ g.save(); g.beginPath();
      list.forEach(({F2})=>{ const p=F2.i.map(j=>pr[j]);
        g.moveTo(p[0].sx,p[0].sy); for(let i=1;i<p.length;i++) g.lineTo(p[i].sx,p[i].sy); g.closePath(); });
      g.strokeStyle=olcol; g.lineWidth=f.ol; g.lineJoin='round';
      if(f.soft){ g.filter='blur(1.6px)'; } g.stroke(); g.restore(); }
    for(const {F2,i} of list){
      const p=F2.i.map(j=>pr[j]);
      const cr=(p[1].sx-p[0].sx)*(p[2].sy-p[0].sy)-(p[1].sy-p[0].sy)*(p[2].sx-p[0].sx);
      if(cr>0 && !two) continue;
      let lo=0,hi=0; F2.i.forEach((idx,n)=>{ if(vi[idx]<vi[F2.i[lo]])lo=n; if(vi[idx]>vi[F2.i[hi]])hi=n; });
      let kA=f.amb+vi[F2.i[lo]]*f.gain, kB=f.amb+vi[F2.i[hi]]*f.gain;
      if(f.band){ const q=v=>Math.round(v*f.band)/f.band; kA=f.amb+q(vi[F2.i[lo]])*f.gain; kB=f.amb+q(vi[F2.i[hi]])*f.gain; }
      let ex=0;
      if(f.spec) ex+=Math.pow(Math.max(0,-F2.n.y),f.spx)*120*f.spec;
      if(f.rim)  ex+=Math.pow(1-Math.abs(F2.n.z),3)*90*f.rim;
      if(f.jit)  ex+=(hash(i)-.5)*f.jit;
      g.beginPath(); g.moveTo(p[0].sx,p[0].sy);
      for(let n=1;n<p.length;n++) g.lineTo(p[n].sx,p[n].sy); g.closePath();
      if(f.flat||Math.abs(kA-kB)<.02){ g.fillStyle=paint(F2.c,(kA+kB)/2,ex); }
      else { const gr=g.createLinearGradient(p[lo].sx,p[lo].sy,p[hi].sx,p[hi].sy);
        gr.addColorStop(0,paint(F2.c,kA,ex)); gr.addColorStop(1,paint(F2.c,kB,ex)); g.fillStyle=gr; }
      g.strokeStyle=paint(F2.c,(kA+kB)/2,ex); g.lineWidth=.7; g.fill(); g.stroke();
    }
  }
  const dark=c=>`rgb(${cl(c[0]*f.olk)},${cl(c[1]*f.olk)},${cl(c[2]*f.olk)})`;
  const neonOl=c=>`rgb(${cl(c[0]*f.olk+40)},${cl(c[1]*f.olk+70)},${cl(c[2]*f.olk+60)})`;

  mesh(SCENE.sea,dark(C.sea),true);
  const blob=(x,z,r,a)=>{ const c=proj(V(x,8,z)); g.save(); g.beginPath();
    g.ellipse(c.sx,c.sy,r*sc,r*sc*Math.cos(pitch)*.9,0,0,7);
    g.fillStyle=`rgba(6,30,52,${a})`; g.filter='blur(6px)'; g.fill(); g.restore(); };
  const foam=(x,z,r)=>{ const c=proj(V(x,8,z));
    g.beginPath(); g.ellipse(c.sx,c.sy,r*sc,r*sc*Math.cos(pitch)*.9,0,0,7);
    g.strokeStyle=f.neon?'rgba(150,255,240,.85)':'rgba(255,255,255,.92)';
    g.lineWidth=Math.max(2.2,5*sc); g.stroke(); };
  [[-136,-96,68],[152,116,54],[130,-160,38]].forEach(([x,z,r])=>{ blob(x,z,r*.95,.20); foam(x,z,r); });
  blob(0,6,26,.28);
  SCENE.isles.forEach(m=>mesh(m,(f.neon?neonOl:dark)(C.grass),false));
  mesh(SCENE.ship,(f.neon?neonOl:dark)(C.hull),false);

  for(let i=0;i<14;i++){ const a=i*2.399,r=60+((i*53)%180), c=proj(V(Math.cos(a)*r,8,Math.sin(a)*r));
    const s=3+((i*7)%4); g.save(); g.globalAlpha=.35+((i%3)*.16); g.fillStyle='#fff'; g.beginPath();
    g.moveTo(c.sx,c.sy-s); g.quadraticCurveTo(c.sx,c.sy,c.sx+s,c.sy);
    g.quadraticCurveTo(c.sx,c.sy,c.sx,c.sy+s); g.quadraticCurveTo(c.sx,c.sy,c.sx-s,c.sy);
    g.quadraticCurveTo(c.sx,c.sy,c.sx,c.sy-s); g.fill(); g.restore(); }

  if(f.grain){ const im=g.getImageData(0,0,cv.width,cv.height), d=im.data, W2=cv.width;
    for(let i=0;i<d.length;i+=4){
      const px=(i/4)%W2, py=(i/4/W2)|0;
      const n = f.knit ? (Math.sin(px*.9)+Math.cos(py*1.7))*f.grain*.5 + (Math.random()-.5)*f.grain*.6
                       : (Math.random()-.5)*f.grain;
      d[i]+=n; d[i+1]+=n; d[i+2]+=n; }
    g.putImageData(im,0,0); }
  if(ui) drawUI(g,w,h);
}

function drawUI(g,w,h){
  const R=(x,y,ww,hh,r)=>{ g.beginPath(); g.moveTo(x+r,y);
    g.arcTo(x+ww,y,x+ww,y+hh,r); g.arcTo(x+ww,y+hh,x,y+hh,r);
    g.arcTo(x,y+hh,x,y,r); g.arcTo(x,y,x+ww,y,r); g.closePath(); };
  const S=w/820;
  const pill=(x,y,ww,hh,fill,txt,sub)=>{ g.save(); g.shadowColor='rgba(4,18,34,.45)';
    g.shadowBlur=10; g.shadowOffsetY=4; R(x,y,ww,hh,hh/2); g.fillStyle=fill; g.fill(); g.restore();
    R(x,y,ww,hh,hh/2); g.strokeStyle='rgba(255,255,255,.75)'; g.lineWidth=2; g.stroke();
    g.fillStyle='#3a2a1c'; g.textBaseline='middle'; g.font=`700 ${hh*.46}px system-ui,sans-serif`;
    g.fillText(txt,x+hh*.92,y+hh*.54);
    g.fillStyle='rgba(58,42,28,.62)'; g.font=`600 ${hh*.30}px system-ui,sans-serif`;
    g.fillText(sub,x+hh*.92,y+hh*.20); };
  const coin=(x,y,r,c1,c2)=>{ g.save(); g.shadowColor='rgba(4,18,34,.4)'; g.shadowBlur=6;
    g.shadowOffsetY=3; g.beginPath(); g.arc(x,y,r,0,7); g.fillStyle=c1; g.fill(); g.restore();
    g.beginPath(); g.arc(x,y,r*.66,0,7); g.fillStyle=c2; g.fill(); };
  pill(14*S,14*S,150*S,42*S,'#fff6dc','1,240','所持'); coin(35*S,35*S,15*S,'#f6c445','#ffe38c');
  pill(w-176*S,14*S,162*S,42*S,'#ffe0e0','4,000','取り立てまで 7'); coin(w-155*S,35*S,15*S,'#e8607a','#ff9aa8');
  const bt=(cx,cyy,r,fill,label)=>{ g.save(); g.shadowColor='rgba(4,18,34,.5)'; g.shadowBlur=12;
    g.shadowOffsetY=6; g.beginPath(); g.arc(cx,cyy,r,0,7); g.fillStyle=fill; g.fill(); g.restore();
    g.beginPath(); g.arc(cx,cyy-r*.22,r*.78,Math.PI*1.08,Math.PI*1.92);
    g.strokeStyle='rgba(255,255,255,.55)'; g.lineWidth=r*.24; g.lineCap='round'; g.stroke();
    g.fillStyle='#fff'; g.font=`700 ${r*.5}px system-ui,sans-serif`; g.textAlign='center';
    g.fillText(label,cx,cyy+r*.06); g.textAlign='start'; };
  const by=h-40*S, br=30*S;
  bt(w/2-84*S,by,br,'#4fb8f0','繋ぐ'); bt(w/2,by+4*S,br*1.16,'#f0a63c','出す');
  bt(w/2+84*S,by,br,'#8f8f9c','待つ');
}

/* ── 置く ── */
const hero=document.getElementById('hero'), hname=document.getElementById('heroname');
let cur=0, yaw=.6, pitch=.6, drag=null, auto=true;
const drawHero=()=>render(hero,cur,{yaw,pitch,zoom:1.02,ui:true,ratio:.56});
hero.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,yaw,pitch};auto=false;
  hero.setPointerCapture(e.pointerId);});
hero.addEventListener('pointermove',e=>{ if(!drag)return;
  yaw=drag.yaw+(e.clientX-drag.x)*.008;
  pitch=Math.max(.2,Math.min(1.25,drag.pitch+(e.clientY-drag.y)*.006)); drawHero(); });
addEventListener('pointerup',()=>drag=null);

const grid=document.getElementById('grid'), smalls=[];
F.forEach((s,i)=>{ const fg=document.createElement('figure');
  fg.innerHTML=`<canvas></canvas><figcaption><span class="num">${i+1}</span>${s.n}
    <span class="how">${s.h}</span></figcaption>`;
  grid.appendChild(fg); const cv=fg.querySelector('canvas'); smalls.push([cv,i]);
  cv.addEventListener('click',()=>{ cur=i; hname.textContent=`${i+1}　${s.n}`; drawHero(); }); });
const drawSmall=()=>smalls.forEach(([cv,i])=>render(cv,i));
addEventListener('resize',()=>{drawHero();drawSmall();});
(function tick(){ if(auto){ yaw+=.0013; drawHero(); } requestAnimationFrame(tick); })();
drawHero(); drawSmall();
</script>
